name: ✨ master

on:
  push:
    branches:
      - master
permissions:
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_descriptors:
    name: 🔎 validate descriptors
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        timeout-minutes: 10
        uses: actions/checkout@v6.0.2

      - name: Setup python
        timeout-minutes: 10
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ERC-7730 library
        timeout-minutes: 10
        run: pip install erc7730

      - name: Validate ERC-7730 descriptors
        timeout-minutes: 30
        run: find registry -name '*.json' ! -name '*.tests.json' -print0 | xargs -0 erc7730 lint --gha

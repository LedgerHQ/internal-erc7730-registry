name: Clear Signing Tests

# Runs the `tests/*.tests.json` cases of the changed descriptors on emulated devices, with the clear-signing tester of
# LedgerHQ/device-sdk-ts. The tester books Speculos pods from Speculinho; the descriptors under test are signed with
# the Speculos test keys by the descriptor API of the device-sdk-ts sample app, started locally, so a descriptor is
# tested as it is in the PR, before it reaches CAL. In that test mode, names signed with production keys (ENS, trusted
# names) are rejected by the device, so a case expecting one fails.

on:
  pull_request:
    paths:
      - 'registry/**/*.json'
      - '.github/workflows/clear-signing-tests.yml'

  pull_request_target:
    types: [labeled]

  workflow_dispatch:
    inputs:
      descriptors:
        description: 'Descriptor files to test, space-separated (e.g. registry/lido/calldata-stETH.json)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_COLOR: "1"
  DMK_REPO: "LedgerHQ/device-sdk-ts"
  DMK_REF: "develop"
  RUN_TESTS_LABEL: "run-tests"
  DESCRIPTOR_API_PORT: "5328"
  # Tested when only this workflow changes, so a change to it is tested in its own PR: one calldata, one EIP-712.
  SELF_TEST_DESCRIPTORS: "registry/lido/calldata-stETH.json registry/1inch/eip712-1inch-limit-order.json"

jobs:
  check-permissions:
    name: Check permissions
    runs-on: ubuntu-latest
    outputs:
      can_run_tests: ${{ steps.check.outputs.can_run_tests }}
      is_fork: ${{ steps.check.outputs.is_fork }}
    steps:
      - name: Check if tests can run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          # This repository is itself a GitHub fork, so `head.repo.fork` is true for every PR: compare repositories.
          IS_FORK="false"
          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$HEAD_REPO" != "$REPO" ]]; then
            IS_FORK="true"
          fi
          echo "is_fork=$IS_FORK" >> $GITHUB_OUTPUT

          # pull_request: PRs from this repository (secrets available).
          # pull_request_target: fork PRs, once a maintainer adds the run-tests label.
          # workflow_dispatch: maintainers.
          CAN_RUN="false"
          case "$EVENT_NAME" in
            pull_request) [[ "$IS_FORK" == "false" ]] && CAN_RUN="true" ;;
            pull_request_target) [[ "$IS_FORK" == "true" && "$EVENT_ACTION" == "labeled" && "$LABEL_NAME" == "$RUN_TESTS_LABEL" ]] && CAN_RUN="true" ;;
            workflow_dispatch) CAN_RUN="true" ;;
          esac
          echo "can_run_tests=$CAN_RUN" >> $GITHUB_OUTPUT

      - name: Save PR metadata for fork notification
        if: github.event_name == 'pull_request' && steps.check.outputs.is_fork == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "{\"pr_number\": $PR_NUMBER, \"needs_notification\": true}" > pr-metadata.json

      - name: Upload PR metadata
        if: github.event_name == 'pull_request' && steps.check.outputs.is_fork == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr-metadata
          path: pr-metadata.json
          retention-days: 1

  detect-tests:
    name: Detect test files
    needs: check-permissions
    if: needs.check-permissions.outputs.can_run_tests == 'true'
    runs-on: ubuntu-latest
    outputs:
      has_tests: ${{ steps.detect.outputs.has_tests }}
      test_matrix: ${{ steps.detect.outputs.test_matrix }}
      changed_descriptors: ${{ steps.detect.outputs.changed_descriptors }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          # For pull_request_target, checkout the PR head
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Get changed files
        id: changed-files
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@v47.0.5
        with:
          files: |
            registry/**/calldata-*.json
            registry/**/eip712-*.json
            .github/workflows/clear-signing-tests.yml

      - name: Detect test files for changed descriptors
        id: detect
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          DISPATCH_DESCRIPTORS: ${{ inputs.descriptors }}
        run: |
          # A changed test file counts as a change to its descriptor.
          DESCRIPTORS=()
          WORKFLOW_CHANGED="false"
          for file in $CHANGED_FILES $DISPATCH_DESCRIPTORS; do
            case "$file" in
              .github/workflows/*) WORKFLOW_CHANGED="true" ;;
              */tests/*.tests.json) DESCRIPTORS+=("$(dirname "$(dirname "$file")")/$(basename "$file" .tests.json).json") ;;
              *) DESCRIPTORS+=("$file") ;;
            esac
          done
          if [[ ${#DESCRIPTORS[@]} -eq 0 && "$WORKFLOW_CHANGED" == "true" ]]; then
            DESCRIPTORS=($SELF_TEST_DESCRIPTORS)
          fi

          TEST_ENTRIES=()
          CHANGED_DESCRIPTORS=()
          for file in $(printf '%s\n' "${DESCRIPTORS[@]}" | sort -u); do
            [[ -f "$file" ]] || continue  # deleted
            descriptor_name=$(basename "$file" .json)
            descriptor_dir=$(dirname "$file")
            test_file="${descriptor_dir}/tests/${descriptor_name}.tests.json"

            case "$descriptor_name" in
              calldata-*) test_type="calldata" ;;
              eip712-*) test_type="eip712" ;;
              *) continue ;;
            esac
            CHANGED_DESCRIPTORS+=("$file")

            if [ -f "$test_file" ]; then
              entity=$(echo "$descriptor_dir" | sed 's|registry/||' | cut -d'/' -f1)
              TEST_ENTRIES+=("$(jq -nc --arg descriptor "$file" --arg test_file "$test_file" --arg test_type "$test_type" \
                --arg entity "$entity" --arg descriptor_name "$descriptor_name" '$ARGS.named')")
            fi
          done

          if [ ${#TEST_ENTRIES[@]} -gt 0 ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
            echo "test_matrix=$(printf '%s\n' "${TEST_ENTRIES[@]}" | jq -sc '.')" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "test_matrix=[]" >> $GITHUB_OUTPUT
          fi
          echo "changed_descriptors=${CHANGED_DESCRIPTORS[*]}" >> $GITHUB_OUTPUT

  run-tests:
    name: Run tests for ${{ matrix.test.entity }}/${{ matrix.test.descriptor_name }} (${{ matrix.device }})
    needs: [check-permissions, detect-tests]
    if: needs.detect-tests.outputs.has_tests == 'true'
    # Speculinho is reached from Ledger's runners, like the device-sdk-ts CI does.
    runs-on: public-ledgerhq-shared-small
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.detect-tests.outputs.test_matrix) }}
        device: [flex]
    steps:
      - name: Checkout registry
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: registry
          persist-credentials: false

      - name: Checkout base scripts
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base-scripts
          sparse-checkout: .github/scripts

      - name: Checkout device-sdk-ts
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ env.DMK_REPO }}
          ref: ${{ env.DMK_REF }}
          path: dmk

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: dmk/package.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install and build the tester
        working-directory: dmk
        run: |
          pnpm install --frozen-lockfile
          pnpm build:libs

      - name: Start the descriptor API
        working-directory: dmk/apps/sample
        run: |
          python -m pip install -r requirements.txt
          nohup python -m flask --app api/index run --port "$DESCRIPTOR_API_PORT" > "$RUNNER_TEMP/descriptor-api.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf "http://127.0.0.1:$DESCRIPTOR_API_PORT/api/certificates" > /dev/null && exit 0
            sleep 1
          done
          echo "::error::The descriptor API did not start"
          cat "$RUNNER_TEMP/descriptor-api.log"
          exit 1

      - name: Prepare the scenario and the descriptor
        env:
          DESCRIPTOR: ${{ matrix.test.descriptor }}
          TEST_FILE: ${{ matrix.test.test_file }}
          TEST_TYPE: ${{ matrix.test.test_type }}
          ENTITY: ${{ matrix.test.entity }}
          DESCRIPTOR_NAME: ${{ matrix.test.descriptor_name }}
          DEVICE: ${{ matrix.device }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p test-inputs screenshots logs dmk/apps/clear-signing-tester/ressources/registry
          node "$WORKSPACE/base-scripts/.github/scripts/resolve-erc7730-includes.js" \
            "$WORKSPACE/registry/$DESCRIPTOR" \
            "$WORKSPACE/test-inputs/resolved-descriptor.json"

          # The tester reads scenario files: the test file's cases, wrapped with what to run them on.
          export ACTION=$([[ "$TEST_TYPE" == "calldata" ]] && echo "signTransaction" || echo "signTypedData")
          export SCENARIO="$ENTITY-$DESCRIPTOR_NAME"
          python - "registry/$TEST_FILE" "dmk/apps/clear-signing-tester/ressources/registry/$SCENARIO.json" <<'EOF'
          import json, os, sys
          tests = json.load(open(sys.argv[1]))["tests"]
          scenario = {"group": "registry", "name": os.environ["SCENARIO"], "action": os.environ["ACTION"],
                      "devices": [os.environ["DEVICE"]], "coinApp": "Ethereum", "mode": "parallel", "cases": tests}
          json.dump(scenario, open(sys.argv[2], "w"), indent=1)
          EOF
          echo "SCENARIO=$SCENARIO" >> $GITHUB_ENV

      - name: Run clear signing tests
        id: run-tests
        working-directory: dmk
        env:
          FORCE_COLOR: "0"
          GATING_TOKEN: ${{ secrets.GATING_TOKEN }}
          ERC7730_API_URL: http://127.0.0.1:${{ env.DESCRIPTOR_API_PORT }}
          WORKSPACE: ${{ github.workspace }}
          DEVICE: ${{ matrix.device }}
        run: |
          if [[ -z "$GATING_TOKEN" ]]; then
            echo "::error::The GATING_TOKEN secret is not set: CAL would answer 401 and every case would be blind signed"
            echo "exit_code=1" >> $GITHUB_OUTPUT
            exit 1
          fi

          set +e
          pnpm cs-tester cli test "registry:$SCENARIO" \
            --device "$DEVICE" \
            --concurrency 6 \
            --erc7730-files "$WORKSPACE/test-inputs/resolved-descriptor.json" \
            --screenshot-folder-path "$WORKSPACE/screenshots" \
            --log-dir "$WORKSPACE/logs" \
            --file-log-level debug 2>&1 | tee test-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit "$EXIT_CODE"

      - name: Write job summary
        if: always()
        working-directory: dmk
        env:
          ENTITY: ${{ matrix.test.entity }}
          DESCRIPTOR_NAME: ${{ matrix.test.descriptor_name }}
          DEVICE: ${{ matrix.device }}
          EXIT_CODE: ${{ steps.run-tests.outputs.exit_code }}
        run: |
          echo "## $ENTITY / $DESCRIPTOR_NAME ($DEVICE)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$EXIT_CODE" == "0" ]; then
            echo "✅ **All tests passed (clear signed)**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Exit code: ${EXIT_CODE:-none}**" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed -n '/SCENARIO RESULTS/,$p' test-output.log 2>/dev/null | grep -vE 'ERR_PNPM|ELIFECYCLE' >> $GITHUB_STEP_SUMMARY || echo "No output available" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Save exit code
        if: always()
        env:
          EXIT_CODE: ${{ steps.run-tests.outputs.exit_code }}
        run: echo "${EXIT_CODE:-1}" > screenshots/exit_code.txt

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: screenshots-${{ matrix.device }}-${{ matrix.test.entity }}-${{ matrix.test.descriptor_name }}
          path: screenshots/
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: logs-${{ matrix.device }}-${{ matrix.test.entity }}-${{ matrix.test.descriptor_name }}
          path: |
            dmk/test-output.log
            logs/
          retention-days: 7

  post-results:
    name: Post results to PR
    needs: [check-permissions, detect-tests, run-tests]
    if: always() && github.event_name != 'workflow_dispatch' && needs.detect-tests.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: screenshots-*

      - name: Post PR comment
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifacts = fs.existsSync('artifacts')
              ? fs.readdirSync('artifacts').filter(d => d.startsWith('screenshots-'))
              : [];
            let body = '## Clear Signing Test Results\n\n';

            if (artifacts.length === 0) {
              body += `> No test results found, see the [run](${runUrl}).\n`;
            } else {
              body += '| Device | Entity | Descriptor | Status | Screenshots |\n|--------|--------|------------|--------|-------------|\n';
              for (const a of artifacts) {
                const [, device, entity, ...rest] = a.split('-');
                const descriptor = rest.join('-');
                const artifactPath = path.join('artifacts', a);
                const count = fs.readdirSync(artifactPath).filter(f => f.endsWith('.png')).length;

                let status = '❓ Unknown';
                try {
                  const exitCode = fs.readFileSync(path.join(artifactPath, 'exit_code.txt'), 'utf8').trim();
                  status = exitCode === '0' ? '✅ Clear signed' : '❌ Failed';
                } catch (e) {}

                body += `| ${device} | ${entity} | ${descriptor} | ${status} | ${count} |\n`;
              }
              body += `\n📸 [Download artifacts](${runUrl}#artifacts) · 📋 [View test details](${runUrl})\n`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('Clear Signing Test Results'));

            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
            }

  notify-missing-tests:
    name: Notify missing tests
    needs: [check-permissions, detect-tests]
    if: github.event_name != 'workflow_dispatch' && needs.check-permissions.outputs.can_run_tests == 'true' && needs.detect-tests.outputs.has_tests == 'false' && needs.detect-tests.outputs.changed_descriptors != ''
    runs-on: ubuntu-latest
    steps:
      - name: Post comment
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const body = `## Clear Signing Tests\n\n> ℹ️ No test files found for the changed descriptors.\n\nCreate a test file at \`registry/<entity>/tests/<descriptor-name>.tests.json\`\n\nSee [testing documentation](../blob/master/README.md#reference-test-cases) for details.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('Clear Signing Tests'));

            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
            }
